version: "3"
services:
  api:
    container_name: go-sse-api
    build:
      context: .
      dockerfile: ./cmd/api/Dockerfile
    ports:
      - 3000:3000

  redis:
    container_name: go-sse-redis
    image: redis:7.4.2
    volumes:
      - ./healthchecks:/healthchecks
    healthcheck:
      test: /healthchecks/redis.sh
      interval: 5s
    ports:
      - 6379:6379
    networks:
      - go-sse-backend

  # sqlite:
